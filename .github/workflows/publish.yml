name: Publish on NuGet

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch: 

jobs: 
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      
      - name: Pack
        run: dotnet pack -c Release
      
      - name: Publish
        run: dotnet nuget push bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json
