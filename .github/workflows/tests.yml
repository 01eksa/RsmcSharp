name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  Tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-15-intel, windows-2022, ubuntu-22.04-arm, macos-15, windows-11-arm ]

    runs-on: ${{ matrix.os }}
    name: Test on ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Run tests
        run: dotnet test

